name: LK ONLINE APK Builder

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: bun install

      - name: Fix TypeScript Version
        run: bun add -d typescript@5.9.3

      - name: Install Capacitor
        run: |
          bun add @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build Web
        run: bun run build

      - name: Setup Capacitor
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            bunx cap init "LK ONLINE" "com.lk.online" --web-dir=dist
          fi

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Android
        run: bunx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LK-ONLINE-APK
          path: android/app/build/outputs/apk/debug/*.apk
