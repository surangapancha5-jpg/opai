name: LK ONLINE APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --include=optional --no-audit --no-fund

      - name: Fix TypeScript Version
        run: |
          npm install --save-dev typescript@5.9.3 --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save --legacy-peer-deps

      - name: Check Versions
        run: |
          npx tsc --version
          npx cap --version

      - name: Build Web
        run: npm run build

      - name: Setup Capacitor
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "LK ONLINE" "com.lk.online" --web-dir=dist
          fi

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LK-ONLINE-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
